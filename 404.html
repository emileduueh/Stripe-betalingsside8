<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side ikke fundet — EmilKLMedia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F1E1C'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-weight='700' fill='%23F4B740' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080F1E; --surface:#0E1929;
  --border:rgba(246,241,232,0.07); --border-strong:rgba(246,241,232,0.14);
  --text:#F6F1E8; --text-muted:#8FA3B0; --text-faint:#4E6070;
  --gold:#F4B740; --gold-soft:rgba(244,183,64,0.12);
  --coral:#FF5A43;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.65;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
h1,h2{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.01em;}
a{color:var(--gold);text-decoration:none;}
.wrap{max-width:900px;margin:0 auto;padding:0 24px;}

header{padding:20px 0;border-bottom:1px solid var(--border);}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.1rem;}
.logo span{color:var(--gold);}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:80px 24px;text-align:center;}
.content{max-width:520px;}
.big-num{font-family:'Space Grotesk',sans-serif;font-size:7rem;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(244,183,64,0.3);letter-spacing:-0.04em;margin-bottom:16px;user-select:none;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--coral);margin-bottom:14px;}
h1{font-size:1.8rem;margin-bottom:12px;}
p{color:var(--text-muted);margin-bottom:40px;font-size:1rem;}

.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#1A0E0B;font-weight:600;padding:12px 24px;border-radius:100px;font-size:0.9rem;transition:opacity 0.2s,transform 0.2s;}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px);}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;color:var(--text-muted);border:1px solid var(--border-strong);padding:12px 24px;border-radius:100px;font-size:0.9rem;transition:color 0.2s;}
.btn-ghost:hover{color:var(--text);}

footer{padding:24px;text-align:center;border-top:1px solid var(--border);}
footer p{font-size:0.82rem;color:var(--text-faint);}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="logo">Emil KL<span>Media</span></a>
  </div>
</header>

<main>
  <div class="content">
    <div class="big-num">404</div>
    <div class="eyebrow">Side ikke fundet</div>
    <h1>Den her side eksisterer ikke</h1>
    <p>Siden du leder efter er enten blevet slettet, flyttet eller har aldrig eksisteret. Gå tilbage til forsiden og prøv igen.</p>
    <div class="links">
      <a href="index.html" class="btn-primary">← Gå til forsiden</a>
      <a href="index.html#contact" class="btn-ghost">Kontakt os</a>
    </div>
  </div>
</main>

<footer>
  <p>&copy; 2026 EmilKLMedia &mdash; <a href="privatliv.html">Privatlivspolitik</a></p>
</footer>

</body>
</html>
