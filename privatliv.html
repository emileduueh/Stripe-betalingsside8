<style>
  :root{
    --bg: #0A1628;
    --bg-deep: #070F1A;
    --surface: #0F2040;
    --surface-2: #152850;
    --border: rgba(150,180,255,0.10);
    --border-strong: rgba(150,180,255,0.18);
    --text: #F6F1E8;
    --text-muted: #8BA8C8;
    --text-faint: #5A7A9E;
    --gold: #F4B740;
    --coral: #FF5A43;
    --mint: #6FDFB8;
    --radius: 14px;
    --maxw: 800px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(246,241,232,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(246,241,232,0.025) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none; z-index: 0;
    mask-image: radial-gradient(ellipse 80% 50% at 50% 0%, black 20%, transparent 70%);
  }

  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
  a { color: var(--gold); text-decoration: none; transition: opacity 0.18s; }
  a:hover { opacity: 0.8; }

  /* ── HEADER ── */
  header {
    position: sticky; top: 0; z-index: 50;
    isolation: isolate;
  }
  header::before {
    content: ''; position: absolute; inset: 0;
    backdrop-filter: blur(14px);
    background: rgba(7,15,26,0.88);
    border-bottom: 1px solid var(--border);
    z-index: -1;
  }
  .nav {
    max-width: var(--maxw); margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px;
  }
  .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; }
  .logo span { color: var(--gold); }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-muted); font-size: 0.86rem; font-weight: 500;
    transition: color 0.18s;
  }
  .back-link:hover { color: var(--text); opacity: 1; }
  .back-link svg { width: 14px; height: 14px; }

  /* ── LAYOUT ── */
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  /* ── HERO ── */
  .page-hero {
    padding: 56px 0 48px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(244,183,64,0.04) 0%, transparent 100%);
  }
  .page-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--coral); margin-bottom: 16px;
  }
  .page-eyebrow::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--coral); box-shadow: 0 0 8px var(--coral);
  }
  .page-hero h1 { font-size: clamp(2rem, 4vw, 2.8rem); margin-bottom: 12px; }
  .page-hero .lead { font-size: 1rem; color: var(--text-muted); max-width: 560px; }
  .updated-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 100px; padding: 5px 14px; font-size: 0.78rem;
    color: var(--text-faint); font-family: 'IBM Plex Mono', monospace;
    margin-top: 20px;
  }
  .updated-badge::before { content: '🕐'; font-size: 0.85rem; }

  /* ── TLDR ── */
  .tldr {
    margin: 40px 0 0;
    background: linear-gradient(135deg, rgba(244,183,64,0.08) 0%, rgba(255,90,67,0.05) 100%);
    border: 1px solid rgba(244,183,64,0.25); border-radius: var(--radius);
    padding: 24px 28px;
  }
  .tldr-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold);
    margin-bottom: 12px;
  }
  .tldr-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .tldr-list li {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 0.9rem; color: var(--text-muted);
  }
  .tldr-list li::before { content: '✓'; color: var(--mint); font-weight: 700; flex-shrink: 0; margin-top: 1px; }

  /* ── MAIN CONTENT ── */
  main { padding: 56px 0 100px; }

  .content-grid {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 56px;
    align-items: start;
  }

  /* ── TABLE OF CONTENTS ── */
  .toc {
    position: sticky; top: 80px;
  }
  .toc-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-faint);
    margin-bottom: 14px;
  }
  .toc-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .toc-list a {
    display: block; padding: 6px 10px; border-radius: 6px;
    font-size: 0.82rem; color: var(--text-muted); transition: all 0.18s;
    border-left: 2px solid transparent;
  }
  .toc-list a:hover { color: var(--text); background: var(--surface); opacity: 1; }
  .toc-list a.active { color: var(--gold); border-left-color: var(--gold); background: rgba(244,183,64,0.06); }

  /* ── ARTICLE ── */
  .article { min-width: 0; }

  .policy-section { margin-bottom: 52px; scroll-margin-top: 80px; }

  .section-heading {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 18px; padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .section-icon {
    width: 36px; height: 36px; border-radius: 9px;
    background: rgba(244,183,64,0.1); border: 1px solid rgba(244,183,64,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0;
  }
  .section-heading h2 { font-size: 1.15rem; color: var(--text); }

  .article p { color: var(--text-muted); font-size: 0.93rem; margin-bottom: 12px; }
  .article p:last-child { margin-bottom: 0; }

  .article ul {
    list-style: none; display: flex; flex-direction: column; gap: 8px;
    margin-bottom: 14px;
  }
  .article ul li {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 0.9rem; color: var(--text-muted);
  }
  .article ul li::before { content: '→'; color: var(--gold); font-weight: 700; flex-shrink: 0; margin-top: 1px; }
  .article ul li strong { color: var(--text); }

  /* ── DATA CONTROLLER BOX ── */
  .contact-box {
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius); padding: 20px 24px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px;
  }
  .contact-box-item { display: flex; flex-direction: column; gap: 2px; }
  .contact-box-item .field-label { font-size: 0.72rem; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; }
  .contact-box-item .field-value { font-size: 0.9rem; color: var(--text); }
  .contact-box-item .field-value a { color: var(--gold); }
  @media(max-width:500px){ .contact-box{ grid-template-columns:1fr; } }

  /* ── THIRD PARTY CARDS ── */
  .third-party-cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  .tp-card {
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    transition: border-color 0.2s;
  }
  .tp-card:hover { border-color: rgba(244,183,64,0.3); }
  .tp-card-name { font-weight: 600; font-size: 0.9rem; color: var(--text); }
  .tp-card-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
  .tp-card-link { font-size: 0.78rem; color: var(--gold); white-space: nowrap; flex-shrink: 0; }

  /* ── RIGHTS GRID ── */
  .rights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .right-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .right-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
  .right-text { font-size: 0.83rem; color: var(--text-muted); line-height: 1.5; }
  @media(max-width:500px){ .rights-grid{ grid-template-columns:1fr; } }

  /* ── CONTACT CTA ── */
  .contact-cta {
    background: linear-gradient(135deg, rgba(111,223,184,0.08) 0%, rgba(244,183,64,0.06) 100%);
    border: 1px solid rgba(111,223,184,0.2); border-radius: var(--radius);
    padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap;
  }
  .contact-cta p { color: var(--text-muted); font-size: 0.88rem; margin: 0; }
  .contact-cta a.cta-btn {
    display: inline-block; background: var(--gold); color: #0A1628;
    font-weight: 700; font-size: 0.85rem; padding: 10px 20px;
    border-radius: 100px; white-space: nowrap; transition: opacity 0.18s;
  }
  .contact-cta a.cta-btn:hover { opacity: 0.88; }

  /* ── FOOTER ── */
  footer {
    background: var(--bg-deep); border-top: 1px solid var(--border);
    padding: 32px 0;
  }
  .footer-inner {
    max-width: var(--maxw); margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .footer-logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1rem; }
  .footer-logo span { color: var(--gold); }
  .footer-links { display: flex; gap: 20px; }
  .footer-links a { font-size: 0.82rem; color: var(--text-faint); }
  .footer-links a:hover { color: var(--text-muted); opacity: 1; }

  /* ── RESPONSIVE ── */
  @media(max-width:760px){
    .content-grid{ grid-template-columns:1fr; }
    .toc{ display:none; }
    .page-hero{ padding:40px 0 36px; }
  }
</style>

        <div class="policy-section" id="collect">
          <div class="section-heading">

          </div>
          <p>We only collect information you provide directly when you:</p>
          <ul>

        <div class="policy-section" id="third-party">
          <div class="section-heading">
            <div class="section-icon">🔗</div>
            <h2>Third-party services</h2>

          <p>We use the following services to operate the website and handle enquiries. When you use the contact form or the calendar, your information is also processed by these providers:</p>
          <div class="third-party-cards">
            <div class="tp-card">
              <div>

          <div class="rights-grid">
            <div class="right-item">

              <span class="right-text"><strong style="color:var(--text)">Access</strong> — see what information we hold about you</span>

            <div class="right-item">

            </div>
            <div class="right-item">

              <span class="right-text"><strong style="color:var(--text)">Deletion</strong> — have your information deleted ("right to be forgotten")</span>

            <div class="right-item">
              <span class="right-icon">🚫</span>

          <div class="contact-cta">

<script>
  // Active TOC link on scroll
  const sections = document.querySelectorAll('.policy-section[id]');
  const tocLinks = document.querySelectorAll('#tocList a');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        tocLinks.forEach(a => a.classList.remove('active'));
        const active = document.querySelector('#tocList a[href="#' + entry.target.id + '"]');
        if (active) active.classList.add('active');
      }
    });
  }, { rootMargin: '-60px 0px -60% 0px', threshold: 0 });

  sections.forEach(s => observer.observe(s));
</script>
